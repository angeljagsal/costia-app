name: ci
# Release regime: normal commits build nothing. CI runs on version tags
# (v*) and pull requests only; production deploys are manual in Cloudflare.
on:
  pull_request:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run check:pwa --if-present
      - run: npm run check:contrast --if-present
      - run: npm run build
