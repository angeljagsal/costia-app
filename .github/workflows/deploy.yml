name: deploy
# GitHub-native releases. No push trigger: tags and manual runs only.
# Tag flow:  git tag -a vX.Y.Z -m "notes" && git push origin vX.Y.Z
# Manual flow: Actions tab → deploy → Run workflow (deploys current main).
# Cloudflare auto-builds stay OFF; this workflow is the only deploy path.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Account / Cloudflare Pages / Edit
#   CLOUDFLARE_ACCOUNT_ID — from the dash.cloudflare.com URL or sidebar
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_POWERSYNC_URL
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build resolves the version tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
      - name: Sanitize Cloudflare credentials
        # Pasted secrets often carry invisible whitespace (breaks API URLs as
        # %20). Trim them once here; every later step uses the clean values.
        # Only the ID length is printed — never secret contents.
        run: |
          TOKEN="$(printf '%s' '${{ secrets.CLOUDFLARE_API_TOKEN }}' | tr -d '[:space:]')"
          ID="$(printf '%s' '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' | tr -d '[:space:]')"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID is not a 32-char hex ID (length ${#ID}). Re-copy the bare ID from the Workers & Pages sidebar."
            exit 1
          fi
          echo "account ID shape OK (32 hex chars)"
      - name: Diagnose Cloudflare access
        # Lists Pages projects visible to the token. Fails early with a clear
        # error on bad token/account instead of a bare exit code at deploy.
        run: npx -y wrangler@3 pages project list
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=costia-app
